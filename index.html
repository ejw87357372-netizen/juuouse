<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>juuouse · AI 유용한 정보 공유</title>
  <meta name="description" content="바이브코딩, AI 프롬프트, 디자인 용어까지 — juuouse가 정리한 AI 실전 자료 모음">
  <link rel="canonical" href="https://juuouse.com/">

  <!-- ▼ Google Search Console 소유권 확인 (HTML 태그 방식일 때 content 값 교체) -->
  <meta name="google-site-verification" content="여기에_서치콘솔_코드">

  <!-- 공유 미리보기 (카톡·인스타 DM 등) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://juuouse.com/">
  <meta property="og:title" content="juuouse · AI 유용한 정보 공유">
  <meta property="og:description" content="바이브코딩·AI 프롬프트·디자인 용어 자료 모음">
  <meta property="og:image" content="https://juuouse.com/assets/og.jpg">
  <meta name="theme-color" content="#fef9fe" media="(max-width:899px)">
  <meta name="theme-color" content="#9b3b8a" media="(min-width:900px)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐰</text></svg>">

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

  <script src="links.js"></script>

  <!-- ▼ Google Analytics 4 (ID는 links.js 의 gaId 에서 관리) -->
  <script>
    (function () {
      var id = window.SITE && SITE.gaId;
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      if (!id || id.indexOf("XXXX") > -1) return; // ID 넣기 전엔 꺼둠
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
      document.head.appendChild(s);
      gtag("js", new Date());
      gtag("config", id);
    })();
  </script>

  <style>
    :root{
      --plum:#9b3b8a; --plum-deep:#6e2462; --plum-soft:#c768b5;
      --blush:#fef9fe; /* 인포크 모바일 배경색 */
      --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"; --pink:#ffd9ee; --ink:#2a1626; --sub:#7c6276;
      --card:#ffffff; --line:rgba(155,59,138,.12);
      --shadow:0 2px 10px rgba(110,36,98,.08);
      --shadow-up:0 14px 34px rgba(110,36,98,.18);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:var(--font);
      color:var(--ink); background:var(--plum);
      -webkit-font-smoothing:antialiased; word-break:keep-all;
    }
    a{color:inherit;text-decoration:none}
    img{display:block}

    /* ---------- 공통 ---------- */
    .avatar{
      border-radius:50%; overflow:hidden; background:var(--pink);
      display:grid; place-items:center; flex-shrink:0;
      box-shadow:0 0 0 4px #fff, 0 6px 20px rgba(110,36,98,.25);
    }
    .avatar img{width:100%;height:100%;object-fit:cover}
    .socials{display:flex;gap:10px}
    .socials a{
      width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
      background:#fff;color:var(--plum);box-shadow:var(--shadow);transition:.2s;
    }
    .socials a:hover{background:var(--plum);color:#fff;transform:translateY(-2px)}
    .socials svg{width:18px;height:18px}
    .icon-btn{
      width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;
      background:rgba(155,59,138,.08);color:var(--plum);display:grid;place-items:center;transition:.2s;
    }
    .icon-btn:hover{background:var(--plum);color:#fff}
    .icon-btn svg{width:18px;height:18px}
    .toast{
      position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);
      background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;
      font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:99;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    /* =========================================================
       📱 모바일 레이아웃 — 인포크 화면 그대로
       ========================================================= */
    .m-view{
      min-height:100%; background:var(--blush);
      padding:16px 16px calc(48px + env(safe-area-inset-bottom));
      font-family:var(--font);
    }
    .m-top{display:flex;justify-content:space-between}
    .m-top button{
      width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;
      background:#d8d5d8;color:#fff;display:grid;place-items:center;
    }
    .m-top svg{width:20px;height:20px}
    .m-profile{text-align:center;margin-top:-8px}
    .m-profile .avatar{width:80px;height:80px;margin:0 auto 14px;font-size:40px;box-shadow:none;background:#f3eef3}
    .m-profile h1{font-size:18px;font-weight:700;color:#0a0a0c;letter-spacing:-.01em;line-height:1.3}
    .m-profile p{font-size:14px;font-weight:400;color:#1e1b1c;margin-top:10px}
    .m-profile .socials{justify-content:center;margin-top:16px}
    .m-dots{display:flex;justify-content:center;gap:9px;margin:44px 0 0}
    .m-dots i{width:4px;height:4px;border-radius:50%;background:#bbb6ba}
    .m-section{text-align:center;font-size:16px;font-weight:600;color:#1e1b1c;margin:48px 0 20px}
    .m-list{display:flex;flex-direction:column;gap:16px;max-width:480px;margin:0 auto}
    .m-link{
      display:flex;align-items:center;justify-content:center;text-align:center;
      min-height:74px;padding:16px 20px;background:#fff;border-radius:12px;
      box-shadow:0 1px 6px rgba(40,20,40,.10);
      font-size:15.5px;font-weight:500;color:#000;letter-spacing:-.01em;line-height:1.4;
      transition:transform .15s;
    }
    .m-link:active{transform:scale(.98)}
    .m-link .new{
      display:inline-block;margin-right:6px;padding:1px 6px;border-radius:6px;
      background:#ffe3f2;color:#c2378f;font-size:11px;font-weight:700;vertical-align:2px;
    }
    .m-foot{text-align:center;font-size:12px;color:#bbb6ba;margin-top:40px}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

    /* =========================================================
       🖥️ PC 레이아웃 (900px 이상)
       ========================================================= */
    .pc-view{display:none}
    @media (min-width:900px){
      .m-view{display:none}
      .pc-view{
        display:grid;grid-template-columns:380px 1fr;min-height:100vh;
        background:
          radial-gradient(900px 600px at 85% -10%,rgba(255,217,238,.25),transparent),
          radial-gradient(700px 500px at -10% 110%,rgba(199,104,181,.5),transparent),
          var(--plum);
      }
      /* 왼쪽: 고정 프로필 */
      .pc-side{
        position:sticky;top:0;height:100vh;padding:56px 44px;
        display:flex;flex-direction:column;color:#fff;
      }
      .pc-side .avatar{width:120px;height:120px;font-size:58px;
        box-shadow:0 0 0 5px rgba(255,255,255,.9),0 18px 40px rgba(0,0,0,.25)}
      .pc-side h1{font-size:40px;font-weight:800;letter-spacing:-.03em;margin-top:28px}
      .pc-side .bio{font-size:17px;opacity:.85;margin-top:10px;line-height:1.5}
      .pc-side .socials{margin-top:24px}
      .pc-side .actions{display:flex;gap:8px;margin-top:14px}
      .pc-side .icon-btn{background:rgba(255,255,255,.15);color:#fff}
      .pc-side .icon-btn:hover{background:#fff;color:var(--plum)}
      .pc-side .qr{
        margin-top:auto;display:flex;align-items:center;gap:14px;
        background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
        padding:14px;border-radius:18px;backdrop-filter:blur(8px);
      }
      .pc-side .qr img{width:76px;height:76px;border-radius:10px;background:#fff;padding:5px}
      .pc-side .qr b{font-size:14px;display:block}
      .pc-side .qr span{font-size:12.5px;opacity:.75;line-height:1.5}

      /* 오른쪽: 카드 그리드 */
      .pc-main{
        background:var(--blush);margin:24px 24px 24px 0;border-radius:32px;
        padding:52px 56px;box-shadow:0 30px 80px rgba(40,0,30,.25);
      }
      .pc-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}
      .pc-head h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
      .pc-head p{color:var(--sub);font-size:14px;margin-top:6px}
      .filters{display:flex;gap:8px;flex-wrap:wrap}
      .filters button{
        border:1px solid var(--line);background:#fff;color:var(--sub);
        padding:8px 14px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;
      }
      .filters button.on,.filters button:hover{background:var(--plum);color:#fff;border-color:var(--plum)}
      .pc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
      .pc-card{
        position:relative;background:#fff;border-radius:22px;padding:26px 24px 22px;
        border:1px solid var(--line);box-shadow:var(--shadow);
        display:flex;flex-direction:column;min-height:200px;
        transition:transform .25s, box-shadow .25s;animation:rise .5s both;
      }
      .pc-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-up)}
      .pc-card .no{position:absolute;top:22px;right:24px;font-size:13px;font-weight:700;color:rgba(155,59,138,.35)}
      .pc-card .em{
        width:54px;height:54px;border-radius:16px;font-size:28px;
        background:linear-gradient(135deg,var(--pink),#fff4fb);display:grid;place-items:center;
      }
      .pc-card .tag{
        align-self:flex-start;margin-top:18px;font-size:11.5px;font-weight:700;
        color:var(--plum);background:rgba(155,59,138,.08);padding:4px 10px;border-radius:999px;
      }
      .pc-card .tt,.pc-card .ds{display:block}
    .pc-card .tt{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.35;margin-top:10px}
      .pc-card .ds{font-size:14px;color:var(--sub);margin-top:6px;line-height:1.5}
      .pc-card .go{
        margin-top:auto;padding-top:18px;font-size:13px;font-weight:700;color:var(--plum);
        display:flex;align-items:center;gap:6px;
      }
      .pc-card .go i{font-style:normal;transition:transform .25s}
      .pc-card:hover .go i{transform:translateX(5px)}
      .pc-foot{margin-top:40px;font-size:12.5px;color:var(--sub);text-align:right}
    }
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>

  <!-- 📱 모바일 -->
  <main class="m-view" aria-label="모바일 링크 페이지">
    <div class="m-top">
      <button data-share aria-label="공유하기"></button>
      <button data-copy aria-label="링크 복사"></button>
    </div>
    <section class="m-profile">
      <div class="avatar" data-avatar></div>
      <h1 data-name></h1>
      <p data-bio></p>
    </section>
    <div class="m-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="m-section" data-section></div>
    <nav class="m-list" id="m-list"></nav>
    <footer class="m-foot">© <span data-year></span> juuouse</footer>
  </main>

  <!-- 🖥️ PC -->
  <div class="pc-view" aria-label="PC 링크 페이지">
    <aside class="pc-side">
      <div class="avatar" data-avatar></div>
      <h1 data-name></h1>
      <p class="bio" data-bio></p>
      <div class="socials" data-socials></div>
      <div class="actions">
        <button class="icon-btn" data-share aria-label="공유하기"></button>
        <button class="icon-btn" data-copy aria-label="링크 복사"></button>
      </div>
      <div class="qr">
        <img alt="juuouse.com QR 코드" src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=0&data=https%3A%2F%2Fjuuouse.com%2F%3Futm_source%3Dqr%26utm_medium%3Doffline">
        <div><b>모바일로 보기</b><span>휴대폰 카메라로<br>QR을 찍어보세요</span></div>
      </div>
    </aside>
    <main class="pc-main">
      <div class="pc-head">
        <div>
          <h2 data-section></h2>
          <p>필요한 자료를 골라 바로 열어보세요</p>
        </div>
        <div class="filters" id="filters"></div>
      </div>
      <div class="pc-grid" id="pc-grid"></div>
      <footer class="pc-foot">© <span data-year></span> juuouse.com</footer>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (function () {
    var S = window.SITE;
    var ICONS = {
      ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
      threads:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16.5 11.5c-.5-3-3-4-5-3.5S8 10.5 9 12.5s4.5 2 6.5.5 1.5-6-2.5-7.5S5 6 5 12s3.5 8 7 8 6.5-2 6.5-5"/></svg>',
      mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>',
      share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 0-4 4m4-4 4 4"/><path d="M5 12v6a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-6"/></svg>',
      copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
    };

    // 현재 보고 있는 레이아웃
    var mq = window.matchMedia("(min-width:900px)");
    function layout(){ return mq.matches ? "pc" : "mobile"; }

    // 바깥 링크에 UTM 붙이기 (이미 utm이 있으면 덮어쓰지 않음)
    function isExternal(url){ return /^https?:\/\//.test(url); }
    function target(url){ return isExternal(url) ? 'target="_blank" rel="noopener"' : ''; }
    function withUtm(url, slug, content){
      if (!isExternal(url)) return url; // 내 사이트 안의 글은 UTM 안 붙임 (GA 세션 끊김 방지)
      try{
        var u = new URL(url);
        var p = { utm_source:S.utm.source, utm_medium:S.utm.medium, utm_campaign:slug, utm_content:content };
        for (var k in p) if (!u.searchParams.has(k)) u.searchParams.set(k, p[k]);
        return u.toString();
      }catch(e){ return url; }
    }

    function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

    // 프로필 공통 채우기
    document.querySelectorAll("[data-name]").forEach(function(el){ el.textContent = S.profile.name; });
    document.querySelectorAll("[data-bio]").forEach(function(el){ el.textContent = S.profile.bio; });
    document.querySelectorAll("[data-section]").forEach(function(el){ el.textContent = S.sectionTitle; });
    document.querySelectorAll("[data-year]").forEach(function(el){ el.textContent = new Date().getFullYear(); });
    document.querySelectorAll("[data-avatar]").forEach(function(el){
      var img = new Image();
      img.alt = S.profile.name + " 프로필";
      img.onload = function(){ el.textContent=""; el.appendChild(img); };
      img.src = S.profile.image;
      el.textContent = S.profile.fallbackEmoji;
    });
    var socialHtml = S.socials.filter(function(s){return s.url;}).map(function(s){
      return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener" aria-label="'+esc(s.name)+'" data-track="social_'+esc(s.icon)+'">'+(ICONS[s.icon]||"")+'</a>';
    }).join("");
    document.querySelectorAll("[data-socials]").forEach(function(el){ el.innerHTML = socialHtml; });
    document.querySelectorAll("[data-share]").forEach(function(b){ b.innerHTML = ICONS.share; });
    document.querySelectorAll("[data-copy]").forEach(function(b){ b.innerHTML = ICONS.copy; });

    // 📱 모바일 목록 (인포크처럼 가운데 제목 + 뒤에 이모지)
    document.getElementById("m-list").innerHTML = S.links.map(function(l,i){
      return '<a class="m-link" '+target(l.url)+' href="'+esc(withUtm(l.url,l.slug,"mobile"))+'" data-slug="'+esc(l.slug)+'" data-title="'+esc(l.title)+'" data-pos="'+(i+1)+'">'+
        '<span>'+(l.isNew?'<span class="new">NEW</span>':'')+esc(l.title)+' '+l.emoji+'</span></a>';
    }).join("");

    // 🖥️ PC 그리드 + 태그 필터
    var grid = document.getElementById("pc-grid");
    grid.innerHTML = S.links.map(function(l,i){
      return '<a class="pc-card" style="animation-delay:'+(i*70)+'ms" '+target(l.url)+' '+
        'href="'+esc(withUtm(l.url,l.slug,"pc"))+'" data-slug="'+esc(l.slug)+'" data-title="'+esc(l.title)+'" data-pos="'+(i+1)+'" data-tag="'+esc(l.tag||"")+'">'+
        '<span class="no">'+String(i+1).padStart(2,"0")+'</span>'+
        '<span class="em">'+l.emoji+'</span>'+
        (l.tag?'<span class="tag">'+esc(l.tag)+'</span>':'')+
        '<span class="tt">'+esc(l.title)+'</span>'+
        '<span class="ds">'+esc(l.desc||"")+'</span>'+
        '<span class="go">자료 열기 <i>→</i></span></a>';
    }).join("");

    var tags = ["전체"].concat(S.links.map(function(l){return l.tag;}).filter(function(t,i,a){return t && a.indexOf(t)===i;}));
    var fb = document.getElementById("filters");
    fb.innerHTML = tags.map(function(t,i){ return '<button class="'+(i?"":"on")+'" data-f="'+esc(t)+'">'+esc(t)+'</button>'; }).join("");
    fb.addEventListener("click", function(e){
      var b = e.target.closest("button"); if(!b) return;
      fb.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);});
      var f = b.dataset.f;
      grid.querySelectorAll(".pc-card").forEach(function(c){ c.style.display = (f==="전체"||c.dataset.tag===f) ? "" : "none"; });
      gtag("event","filter_click",{ filter_tag:f });
    });

    // 📊 GA4 클릭 추적
    document.addEventListener("click", function(e){
      var a = e.target.closest("a[data-slug], a[data-track]"); if(!a) return;
      if (a.dataset.slug){
        gtag("event","link_click",{
          link_id:a.dataset.slug, link_text:a.dataset.title,
          link_position:Number(a.dataset.pos), layout:layout(),
          link_url:a.href, transport_type:"beacon"
        });
      } else {
        gtag("event","social_click",{ platform:a.dataset.track, layout:layout(), transport_type:"beacon" });
      }
    });

    // 공유 / 복사
    var toast = document.getElementById("toast"), tt;
    function say(m){ toast.textContent=m; toast.classList.add("show"); clearTimeout(tt); tt=setTimeout(function(){toast.classList.remove("show");},1800); }
    var shareUrl = "https://juuouse.com/";
    function copy(){
      (navigator.clipboard ? navigator.clipboard.writeText(shareUrl) : Promise.reject())
        .then(function(){ say("링크를 복사했어요 ✨"); })
        .catch(function(){ say(shareUrl); });
      gtag("event","share",{ method:"copy", layout:layout() });
    }
    document.querySelectorAll("[data-copy]").forEach(function(b){ b.onclick = copy; });
    document.querySelectorAll("[data-share]").forEach(function(b){
      b.onclick = function(){
        if (navigator.share){
          navigator.share({ title:document.title, url:shareUrl }).catch(function(){});
          gtag("event","share",{ method:"native", layout:layout() });
        } else copy();
      };
    });
  })();
  </script>
</body>
</html>
